name: Lint

on:
  push:
    paths: [bootstrap.sh, Brewfile, Brewfile.linux, home/**, tests/**, wsl/**]
  pull_request:
    paths: [bootstrap.sh, Brewfile, Brewfile.linux, home/**, tests/**, wsl/**]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck bootstrap.sh
      - run: shellcheck -S warning wsl/setup.sh wsl/setup-root.sh wsl/files/bin/*

  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y bats
      - run: bats tests/
