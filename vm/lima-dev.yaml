# Lima VM for coding agents: this is the dev box. The Mac is the window, the
# keys, the browser and the VM host; code runs here.
#
# Boundary, by design:
#   - no host folders:   mounts: [] means nothing in ~/.config, ~/.ssh or
#                        ~/Library is reachable; code lives in VM-owned clones
#                        that travel through GitHub, so the Mac never runs a
#                        file the VM wrote.
#   - no SSH agent:      ssh.forwardAgent: false. The guest holds its own gh
#                        login instead of borrowing the Mac's 1Password agent.
#   - it does get:       every API key from den.json (mode 600) and the Mac's
#                        browse relay through the vm-up tunnel, on purpose.
#
# Usage:
#   den up --only=vm                       # create, size, start, provision
#   limactl start agent                    # boot by hand
#   ssh lima-agent                         # ~/.ssh/config includes ~/.lima/*/ssh.config
#   limactl stop agent                     # RAM back to the Mac
#   den vm rebuild                         # throw the whole box away

vmType: vz
os: Linux
arch: aarch64

cpus: 4
memory: 8GiB
disk: 40GiB

# No shared folders. VS Code edits the clones over Remote-SSH.
mounts: []

images:
  # Ubuntu 24.04 LTS, aarch64. Lima fills in the digest on first create.
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"

# Lima forwards every guest localhost port to the Mac by default. 19988 is
# the browse relay: the Mac owns it and `rex forward -R` brings it INTO the
# guest. Mirroring it back makes a loop that grabs the port before the Mac
# relay can bind it.
portForwards:
  - guestPort: 19988
    ignore: true

# The guest signs in to GitHub itself; the Mac's 1Password agent stays home.
ssh:
  forwardAgent: false
  loadDotSSHPubKeys: true

# Docker Engine is the container runtime (den installs it). Lima's own
# rootless containerd + nerdctl would be a second stack on every boot.
containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      # Lima runs provision scripts on EVERY boot. Run the apt work once:
      # repeating it slows each start, and den owns the rest.
      set -eux
      # The Rex server and vault sync are systemd --user units, so the user
      # manager must run without a login. Linger by file, not loginctl, so
      # this works before logind answers D-Bus.
      mkdir -p /var/lib/systemd/linger
      touch "/var/lib/systemd/linger/{{.User}}"
      MARKER=/var/lib/lima-agent-provisioned
      [ -f "$MARKER" ] && exit 0
      export DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=l
      apt-get update
      apt-get install -y git curl ca-certificates unzip jq ripgrep fd-find fzf build-essential \
        bubblewrap socat python3 python3-pip
      ln -sf "$(command -v fdfind)" /usr/local/bin/fd || true
      touch "$MARKER"
