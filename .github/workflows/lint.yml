name: Lint

on:
  push:
    paths: [bootstrap.sh, Brewfile, home/**]
  pull_request:
    paths: [bootstrap.sh, Brewfile, home/**]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck bootstrap.sh
